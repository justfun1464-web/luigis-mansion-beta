# Luigi's Mansion BETA: Windows build of this fork.
# A push to the branch "build" builds the Windows package and publishes it as a GitHub
# Release named beta-<beta/VERSION>-<run number>. The configure/build logs are pushed to the branch "ci-logs" (success or
# failure) so the build can be checked without the Actions log viewer.
name: Beta build

on:
  push:
    branches: ['build']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: true

env:
  NINJA_VERSION: 1.13.0

jobs:
  windows:
    name: Windows x64 (beta)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Version
        shell: pwsh
        run: |
          $v = (Get-Content beta/VERSION -Raw).Trim()
          "BETA_TAG=beta-$v-${{ github.run_number }}" >> $env:GITHUB_ENV
      - name: Ninja
        run: pip install "ninja==${{ env.NINJA_VERSION }}"
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1
        with:
          arch: x64
      - name: Configure
        id: configure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cmake --preset windows-clang "-DLM_LLVM_DIR=C:/Program Files/LLVM/bin" *> configure.log
          $code = $LASTEXITCODE
          Get-Content configure.log -Tail 60
          if ($code) { throw "configure failed ($code)" }
      - name: Build
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cmake --build build/windows-clang --target LuigisMansionRecomp -- -k 0 *> build.log
          $code = $LASTEXITCODE
          Select-String -Path build.log -Pattern 'error' -SimpleMatch | Select-Object -First 80 | ForEach-Object { $_.Line }
          if ($code) { throw "build failed ($code)" }
      - name: Package
        shell: pwsh
        run: |
          $tag = "$env:BETA_TAG"
          $name = "LuigisMansionBETA-$tag-windows-x64"
          cmake --install build/windows-clang --prefix "out/$name"
          if ($LASTEXITCODE) { throw "cmake --install failed" }
          foreach ($f in @("LuigisMansionRecomp.exe", "pipelines.bin", "llvm\bin\clang.exe", "llvm\bin\lld-link.exe")) {
            if (-not (Test-Path "out/$name/$f")) { throw "package is missing $f" }
          }
          # Portable by default: the BETA keeps its settings, saves and caches next to the exe.
          New-Item -ItemType File -Force "out/$name/portable.txt" | Out-Null
          if (Test-Path beta/package) { Copy-Item -Recurse -Force beta/package/* "out/$name/" }
          Compress-Archive -Path "out/$name" -DestinationPath "out/$name.zip"
          Get-FileHash -Algorithm SHA256 "out/$name.zip"
          "PKG=out/$name.zip" >> $env:GITHUB_ENV
      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$env:BETA_TAG" "$env:PKG" --target "${{ github.sha }}" --title "Luigi's Mansion BETA $env:BETA_TAG" --notes "Automatic build of ${{ github.sha }}." --prerelease
      - name: Logs to ci-logs branch
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $tag = "$env:BETA_TAG"
          $status = "${{ job.status }}"
          New-Item -ItemType Directory -Force logs-out | Out-Null
          if (Test-Path configure.log) { Copy-Item configure.log "logs-out/configure.log" }
          if (Test-Path build.log) {
            Copy-Item build.log "logs-out/build.log"
            Select-String -Path build.log -Pattern 'error:|error C|error LNK|FAILED:' | ForEach-Object { $_.Line } | Set-Content "logs-out/errors.txt"
          }
          "tag=$tag`nsha=${{ github.sha }}`nconfigure=${{ steps.configure.outcome }}`nbuild=${{ steps.build.outcome }}`nrun=${{ github.run_id }}" | Set-Content "logs-out/STATUS.txt"
          Set-Location logs-out
          git init -q
          git checkout -q -b ci-logs
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "logs for $tag"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs
